[project]
name = "kkul-time"
version = "0.1.0"
description = "꿀시간표: 성균관대 공개 강의 데이터로 시간표를 만들고 수강신청 전략을 짜 주는 웹앱"
readme = "README.md"  # backend/README.md
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "requests>=2.32",
    "pypdf>=4.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "*.md"]  # 설계 문서의 코드 블록은 포맷하지 않는다

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]
